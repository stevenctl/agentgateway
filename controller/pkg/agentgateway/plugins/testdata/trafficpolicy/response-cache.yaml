apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: agw
  namespace: default
spec:
  targetRefs:
    - kind: HTTPRoute
      name: test
      group: gateway.networking.k8s.io
  traffic:
    responseCache:
      ttl: 'response.code == 200 ? duration("5m") : duration("0s")'
      maxBodyBytes: 1Mi
      store:
        redis:
          backendRef:
            name: redis
            port: 6379
          db: 1
          keyPrefix: "agw:"
          operationTimeout: 500ms
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: default
spec:
  ports:
    - port: 6379

---
# Output
output:
- gateway:
    Name: test
    Namespace: default
  resource:
    policy:
      key: traffic/default/agw:response-cache:default/test
      name:
        kind: AgentgatewayPolicy
        name: agw
        namespace: default
      target:
        route:
          kind: HTTPRoute
          name: test
          namespace: default
      traffic:
        responseCache:
          maxBodyBytes: "1048576"
          redis:
            backend:
              port: 6379
              service:
                hostname: redis.default.svc.cluster.local
                namespace: default
            db: "1"
            keyPrefix: 'agw:'
            operationTimeout: 0.500s
          ttl: 'response.code == 200 ? duration("5m") : duration("0s")'
status:
- apiVersion: agentgateway.dev/v1alpha1
  kind: AgentgatewayPolicy
  metadata:
    name: agw
    namespace: default
  spec: null
  status:
    ancestors:
    - ancestorRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: test
        namespace: default
      conditions:
      - lastTransitionTime: fake
        message: Policy accepted
        reason: Valid
        status: "True"
        type: Accepted
      - lastTransitionTime: fake
        message: Attached to all targets
        reason: Attached
        status: "True"
        type: Attached
      controllerName: agentgateway.dev/agentgateway
