# yaml-language-server: $schema=../../schema/local.json
binds:
- port: 3000
  listeners:
  - routes:
    - matches:
      - path:
          pathPrefix: /header
      backends:
      - host: example.com:8080
        policies:
          loadBalancing:
            consistentHash:
              key: 'request.headers["x-session-id"]'
    - matches:
      - path:
          pathPrefix: /cookie
      backends:
      - host: example.com:8080
        policies:
          loadBalancing:
            consistentHash:
              key: 'request.headers.cookie("sid")'
    - matches:
      - path:
          pathPrefix: /source-ip
      backends:
      - host: example.com:8080
        policies:
          loadBalancing:
            consistentHash:
              key: source.address
    - matches:
      - path:
          pathPrefix: /expression
      backends:
      - host: example.com:8080
        policies:
          loadBalancing:
            consistentHash:
              key: 'request.headers["x-user"]'
