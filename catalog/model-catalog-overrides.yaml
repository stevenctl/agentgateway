# Hand-maintained model catalog data merged over the generated base catalog.
providers:
  "*":
    models:
      "*opus-4-6*":
        tags: [adaptive_thinking]
      "*opus-4.6*":
        tags: [adaptive_thinking]
      "*sonnet-4-6*":
        tags: [adaptive_thinking]
      "*sonnet-4.6*":
        tags: [adaptive_thinking]
  # Batch rates verified 2026-09-25; USD per million tokens.
  # https://developers.openai.com/api/docs/guides/batch
  openai:
    models:
      "gpt-4.1":
        batch: &gpt41batch
          rates: {input: "1", output: "4", cacheRead: "0.25"}
      "gpt-4.1-2025-04-14":
        rates: {input: "2", output: "8", cacheRead: "0.5"}
        batch: *gpt41batch
      "gpt-4.1-mini":
        batch: &gpt41minibatch
          rates: {input: "0.2", output: "0.8", cacheRead: "0.05"}
      "gpt-4.1-mini-2025-04-14":
        rates: {input: "0.4", output: "1.6", cacheRead: "0.1"}
        batch: *gpt41minibatch
      "gpt-4.1-nano": &gpt41nano
        rates: {input: "0.1", output: "0.4", cacheRead: "0.025"}
        batch:
          rates: {input: "0.05", output: "0.2", cacheRead: "0.0125"}
      "gpt-4.1-nano-2025-04-14": *gpt41nano
  # https://platform.claude.com/docs/en/about-claude/pricing
  anthropic:
    models:
      "claude-sonnet-4-6":
        batch:
          rates: {input: "1.5", output: "7.5", cacheRead: "0.15", cacheWrite: "1.875"}
      "claude-opus-4-6":
        batch:
          rates: {input: "2.5", output: "12.5", cacheRead: "0.25", cacheWrite: "3.125"}
      "claude-haiku-4-5*":
        batch:
          rates: {input: "0.5", output: "2.5", cacheRead: "0.05", cacheWrite: "0.625"}
  # https://aws.amazon.com/bedrock/pricing/
  # In-region and geo profiles cost 10% more than global.
  aws.bedrock:
    models:
      "*anthropic.claude-sonnet-4-6":
        batch:
          rates: {input: "1.65", output: "8.25"}
      "global.anthropic.claude-sonnet-4-6":
        batch:
          rates: {input: "1.5", output: "7.5"}
      "*anthropic.claude-opus-4-6*":
        batch:
          rates: {input: "2.75", output: "13.75"}
      "global.anthropic.claude-opus-4-6-v1":
        batch:
          rates: {input: "2.5", output: "12.5"}
